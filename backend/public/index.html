<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SMS Service — Demo</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: Canvas; color: CanvasText; }
  header { padding: 16px 24px; border-bottom: 1px solid #8883; }
  h1 { margin: 0; font-size: 18px; }
  nav { display: flex; gap: 4px; padding: 12px 24px 0; }
  nav button { padding: 8px 14px; border: 1px solid #8883; border-bottom: none;
    background: #8881; border-radius: 8px 8px 0 0; cursor: pointer; color: inherit; }
  nav button.active { background: #4f8cff22; border-color: #4f8cff; font-weight: 600; }
  main { padding: 24px; max-width: 900px; }
  .card { border: 1px solid #8883; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; margin: 8px 0 2px; opacity: .8; }
  input, textarea, select { width: 100%; padding: 8px; border: 1px solid #8884;
    border-radius: 6px; background: Field; color: FieldText; font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  button.go { margin-top: 12px; padding: 9px 16px; border: none; border-radius: 6px;
    background: #4f8cff; color: #fff; font-weight: 600; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #8882; }
  .row { display: flex; gap: 8px; align-items: center; }
  .muted { opacity: .6; font-size: 13px; }
  .pill { padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #8882; }
  .pill.sent { background: #4f8cff33; }
  .pill.delivered { background: #35c35933; }
  .pill.failed, .pill.undelivered { background: #ff4d4d33; }
  section { display: none; }
  section.active { display: block; }
</style>
</head>
<body>
<header><h1>Outbound SMS Service — Demo</h1></header>
<nav>
  <button data-tab="tenants" class="active">Tenants</button>
  <button data-tab="templates">Templates</button>
  <button data-tab="leads">Leads</button>
  <button data-tab="send">Send</button>
</nav>
<main>
  <section id="tenants" class="active">
    <div class="card">
      <label>New tenant name</label>
      <div class="row"><input id="t-name" placeholder="Gautam Realty" /><button class="go" id="t-create">Create</button></div>
      <p class="muted">Creating a tenant provisions a Plivo subaccount + sender (best effort).</p>
    </div>
    <div class="card"><table id="t-list"><thead><tr><th>Name</th><th>Sender</th><th>ID</th></tr></thead><tbody></tbody></table></div>
  </section>

  <section id="templates">
    <div class="card">
      <label>Tenant</label>
      <select id="tpl-tenant"></select>
      <label>Name</label><input id="tpl-name" placeholder="New Listing" />
      <label>Body <span class="muted">— use {{name}}, {{city}}, {{type}}, {{link}}</span></label>
      <textarea id="tpl-body" placeholder="Hi {{name}}, new {{type}} in {{city}}. {{link}}"></textarea>
      <button class="go" id="tpl-create">Save template</button>
    </div>
    <div class="card"><table id="tpl-list"><thead><tr><th>Name</th><th>Body</th><th></th></tr></thead><tbody></tbody></table></div>
  </section>

  <section id="leads">
    <div class="card">
      <label>Tenant</label>
      <select id="ld-tenant"></select>
      <div class="row">
        <div style="flex:1"><label>Name</label><input id="ld-name" /></div>
        <div style="flex:1"><label>Phone (E.164)</label><input id="ld-phone" placeholder="+9198..." /></div>
        <div style="flex:1"><label>City</label><input id="ld-city" /></div>
      </div>
      <button class="go" id="ld-create">Add lead</button>
      <label style="margin-top:14px">Bulk paste — <span class="muted">name,phone,city per line</span></label>
      <textarea id="ld-bulk" placeholder="Rahul,+9198xxxxxxx,Baner"></textarea>
      <button class="go" id="ld-bulk-btn">Add bulk</button>
    </div>
    <div class="card"><table id="ld-list"><thead><tr><th>Name</th><th>Phone</th><th>Extra</th></tr></thead><tbody></tbody></table></div>
  </section>

  <section id="send">
    <div class="card">
      <label>Tenant</label><select id="s-tenant"></select>
      <label>Template</label><select id="s-template"></select>
      <label>Leads</label>
      <div id="s-leads" class="card" style="max-height:200px;overflow:auto"></div>
      <button class="go" id="s-send">Send Campaign</button>
    </div>
    <div class="card">
      <div class="row"><strong>Results (live)</strong><span class="muted" id="s-poll"></span></div>
      <table id="s-results"><thead><tr><th>To</th><th>Body</th><th>Status</th></tr></thead><tbody></tbody></table>
    </div>
  </section>
</main>
<script>
const api = (p, opts) => fetch('/api' + p, opts).then(async r => {
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
});
const el = id => document.getElementById(id);
let tenants = [];

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('section').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  el(b.dataset.tab).classList.add('active');
  if (b.dataset.tab === 'send') refreshSend();
});

async function loadTenants() {
  tenants = (await api('/tenants')).tenants;
  const tb = el('t-list').querySelector('tbody');
  tb.innerHTML = tenants.map(t => `<tr><td>${t.name}</td><td>${t.senderId || '—'}</td><td class="muted">${t.id}</td></tr>`).join('');
  for (const sel of ['tpl-tenant', 'ld-tenant', 's-tenant']) {
    el(sel).innerHTML = tenants.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  }
  loadTemplates(); loadLeads();
}

el('t-create').onclick = async () => {
  await api('/tenants', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: el('t-name').value }) });
  el('t-name').value = ''; loadTenants();
};

async function loadTemplates() {
  const id = el('tpl-tenant').value; if (!id) return;
  const { templates } = await api(`/tenants/${id}/templates`);
  el('tpl-list').querySelector('tbody').innerHTML = templates.map(t =>
    `<tr><td>${t.name}</td><td class="muted">${t.body}</td><td><button data-id="${t.id}" class="del">✕</button></td></tr>`).join('');
  el('tpl-list').querySelectorAll('.del').forEach(b => b.onclick = async () => {
    await api('/templates/' + b.dataset.id, { method: 'DELETE' }); loadTemplates();
  });
}
el('tpl-tenant').onchange = loadTemplates;
el('tpl-create').onclick = async () => {
  await api(`/tenants/${el('tpl-tenant').value}/templates`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: el('tpl-name').value, body: el('tpl-body').value }) });
  el('tpl-name').value = ''; el('tpl-body').value = ''; loadTemplates();
};

async function loadLeads() {
  const id = el('ld-tenant').value; if (!id) return;
  const { leads } = await api(`/tenants/${id}/leads`);
  el('ld-list').querySelector('tbody').innerHTML = leads.map(l =>
    `<tr><td>${l.name || '—'}</td><td>${l.phone}</td><td class="muted">${JSON.stringify(l.extra)}</td></tr>`).join('');
}
el('ld-tenant').onchange = loadLeads;
el('ld-create').onclick = async () => {
  await api(`/tenants/${el('ld-tenant').value}/leads`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: el('ld-name').value, phone: el('ld-phone').value, extra: { city: el('ld-city').value } }) });
  el('ld-name').value = el('ld-phone').value = el('ld-city').value = ''; loadLeads();
};
el('ld-bulk-btn').onclick = async () => {
  await api(`/tenants/${el('ld-tenant').value}/leads`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bulk: el('ld-bulk').value }) });
  el('ld-bulk').value = ''; loadLeads();
};

let pollTimer = null;
async function refreshSend() {
  const id = el('s-tenant').value; if (!id) return;
  const { templates } = await api(`/tenants/${id}/templates`);
  el('s-template').innerHTML = templates.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  const { leads } = await api(`/tenants/${id}/leads`);
  el('s-leads').innerHTML = leads.map(l =>
    `<label class="row"><input type="checkbox" value="${l.id}" style="width:auto"> ${l.name || '—'} (${l.phone})</label>`).join('');
  pollMessages();
}
el('s-tenant').onchange = refreshSend;

async function pollMessages() {
  const id = el('s-tenant').value; if (!id) return;
  clearTimeout(pollTimer);
  const { messages } = await api(`/tenants/${id}/messages`);
  el('s-results').querySelector('tbody').innerHTML = messages.map(m =>
    `<tr><td>${m.to}</td><td class="muted">${m.body}</td><td><span class="pill ${m.status}">${m.status}</span></td></tr>`).join('');
  el('s-poll').textContent = 'updated ' + new Date().toLocaleTimeString();
  pollTimer = setTimeout(pollMessages, 3000);
}

el('s-send').onclick = async () => {
  const id = el('s-tenant').value;
  const leadIds = [...el('s-leads').querySelectorAll('input:checked')].map(i => i.value);
  if (!leadIds.length) return alert('select at least one lead');
  const r = await api(`/tenants/${id}/send`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ templateId: el('s-template').value, leadIds }) });
  alert(`total ${r.total}, sent ${r.sent}, failed ${r.failed}`);
  pollMessages();
};

loadTenants();
</script>
</body>
</html>
